<!--Order is important; jquery before bootstrap before our custom css-->

<!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>

<!-- Latest compiled and minified JavaScript -->
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js" integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa" crossorigin="anonymous"></script>

{% if page.isotope-exhibits %}
<script src="https://cdn.jsdelivr.net/npm/muuri@0.9.5/dist/muuri.min.js"></script>
<script type="text/javascript" src="/assets/js/exhibits-muuri.js"></script>
{% endif %}

{% if page.isotope-schedule %}
<script type="text/javascript" src="/assets/js/schedule-filter.js"></script>
{% endif %}

{% if page.carousel %}
<script type="text/javascript" src="/assets/js/mfo-carousel.js"></script>
{% endif %}

{% if page.fullcalendar %}
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js'></script>
{% endif %}

<script type="text/javascript" src="/assets/js/slidemenu.js"></script>

<!-- Theme controller (UFO toggle: light / Maker Invasion / dark). Always loaded.
     The inline config passes the build-time invasion-FX duration to the script. -->
<script>window.MFO_THEME = { defaultTheme: {{ site.data.settings.theme_default | default: 'light' | jsonify }}, invasionFxSeconds: {{ site.data.settings.theme_invasion_fx_duration | default: 10 | jsonify }}, invasionFxFadeoutSeconds: {{ site.data.settings.theme_invasion_fx_fadeout | default: 10 | jsonify }} };</script>
<script type="text/javascript" src="/assets/js/mfo-theme.js"></script>
