<section class="cta-panel">
  <div class="container">
    <div class="row text-center">
      <div class="col-xs-12">
        <h3><a href="{{include.cta_url}}">{% if include.cta_subtext %}<span class="cta-panel-main">{{ include.cta_text }}</span><span class="cta-panel-sub">{{ include.cta_subtext }} <i class="fa fa-chevron-right" aria-hidden="true"></i></span>{% else %}{{ include.cta_text }} <i class="fa fa-chevron-right" aria-hidden="true"></i>{% endif %}</a></h3>
      </div>
    </div>
  </div>
</section>
