<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 120" fill="none" role="img" aria-label="Flying saucer">
  <!-- glow -->
  <ellipse cx="110" cy="70" rx="100" ry="26" fill="#A6E22E" opacity="0.18"/>
  <!-- saucer body -->
  <ellipse cx="110" cy="70" rx="92" ry="22" fill="#9BE021"/>
  <ellipse cx="110" cy="66" rx="92" ry="20" fill="#A6E22E"/>
  <!-- under-rim shadow -->
  <ellipse cx="110" cy="74" rx="70" ry="12" fill="#0a0a0a" opacity="0.35"/>
  <!-- dome -->
  <path d="M62 60 Q110 6 158 60 Z" fill="#F5EAD0"/>
  <path d="M70 58 Q110 18 150 58 Z" fill="#A6E22E" opacity="0.55"/>
  <!-- dome rim -->
  <ellipse cx="110" cy="60" rx="48" ry="9" fill="#9BE021"/>
  <!-- alien eyes peeking from dome -->
  <circle cx="98" cy="44" r="6" fill="#0a0a0a"/>
  <circle cx="122" cy="44" r="6" fill="#0a0a0a"/>
  <circle cx="100" cy="42" r="2" fill="#F5EAD0"/>
  <circle cx="124" cy="42" r="2" fill="#F5EAD0"/>
  <!-- rim lights -->
  <circle cx="40" cy="70" r="5" fill="#F5EAD0"/>
  <circle cx="68" cy="78" r="5" fill="#FF2D8E"/>
  <circle cx="110" cy="81" r="5" fill="#F5EAD0"/>
  <circle cx="152" cy="78" r="5" fill="#FF2D8E"/>
  <circle cx="180" cy="70" r="5" fill="#F5EAD0"/>
</svg>
