<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 110" fill="none" role="img" aria-label="Makey robot being abducted">
  <!-- antenna -->
  <line x1="40" y1="14" x2="40" y2="2" stroke="#F5EAD0" stroke-width="3"/>
  <circle cx="40" cy="3" r="4" fill="#FF2D8E"/>
  <!-- head -->
  <rect x="18" y="14" width="44" height="34" rx="9" fill="#F5EAD0"/>
  <circle cx="31" cy="31" r="5" fill="#0a0a0a"/>
  <circle cx="49" cy="31" r="5" fill="#0a0a0a"/>
  <!-- body -->
  <rect x="22" y="50" width="36" height="38" rx="7" fill="#A6E22E"/>
  <!-- chest "M" -->
  <text x="40" y="76" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#0a0a0a" text-anchor="middle">M</text>
  <!-- arms (raised, being lifted) -->
  <rect x="8" y="50" width="10" height="22" rx="5" fill="#F5EAD0" transform="rotate(28 13 61)"/>
  <rect x="62" y="50" width="10" height="22" rx="5" fill="#F5EAD0" transform="rotate(-28 67 61)"/>
  <!-- legs -->
  <rect x="28" y="88" width="8" height="18" rx="4" fill="#F5EAD0"/>
  <rect x="44" y="88" width="8" height="18" rx="4" fill="#F5EAD0"/>
</svg>
