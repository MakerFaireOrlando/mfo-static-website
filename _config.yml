theme: jekyll-theme-minimal
#incremental: true --tried this to make it faster to build locally, but it caused problems

plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-sitemap


# Google Analytics - https://desiredpersona.com/google-analytics-jekyll/
# GA4 measurement ID for the "Maker Faire Orlando - GA4" web stream (stream id
# 5878877478). Rendered by _includes/analytics.html in production only.
#
# Do NOT remove this again. The old UA-29035632-1 tag that lived here was not
# dead: GA4 was connected to it via Google's connected-site-tags migration, so
# loading the UA tag was what delivered hits to this GA4 property. Dropping it
# on 2026-10-28 silently killed all Analytics collection until 2026-11-02.
google_analytics: G-8WZBWD05S0


#begin seo
title: Maker Faire Orlando
tagline: The Greatest Show (& Tell) on Earth!
description: Maker Faire Orlando is a community-organized, family-friendly celebration featuring local do-it-yourself science, art, rockets, robots, crafts, technology, music, hands-on-activities, and more. It’s an event where people show what they are making and share what they are learning. Maker Faire Orlando is produced by The Maker Effect Foundation.
logo: /assets/images/site-branding/mfo_two_line_border.png

defaults:
  -
    scope:
      path: ""
    values:
      image: /assets/images/site-branding/mfo_two_line_border.png
# WTF was this for? It is called a "glob" pattern and it causes 90k+ lines of trace output
#on the GH pages build console - https://docs.w3cub.com/jekyll/configuration/index
#  -
#    scope:
#      path: "/assets/**/*.pdf"
#    values:
#      sitemap: false
  -
    scope:
      path: 'assets/**'
    values:
      sitemap: false
  -
    scope:
      path: ""
      type: "exhibits" # a collection in your site, in plural form
    values:
      layout: "exhibit"
      #sitemap: #this is specified on each individual exhibit md file
  -
    scope: 
      path: ""
      type: "categories"
    values:
      layout: "category"
      sitemap: true

collections:
  sponsors:
    output: false
    sort_by: sponsor-level
  exhibits:
    output: true
    sort_by: Name
  categories:
    output: true
    sort_by: Name 

# set timezone
timezone: America/New_York

# cause the .well-known directory to be included in the build output, 
# so that we can put things like BIMI logo and security.txt there
include: [".well-known"]


