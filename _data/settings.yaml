
maker_exhibits_holdover: false
maker_exhibits_show_location: false

call_for_makers_open: true
# Exhibit application URL — shown as the "Apply to Exhibit" button on
# /exhibit-at-maker-faire-orlando/ when call_for_makers_open is true.
# UPDATE this to the current year's form before flipping the flag.
cfm_url: https://www.jotform.com/makereffect/cfm2026

# Volunteer registration. When open, /volunteer/ shows the Humanitix shift
# widget; when closed it shows an "opening soon" message.
# UPDATE volunteer_checkout to the current year's Humanitix slug each year.
volunteer_open: false
volunteer_checkout: maker-faire-orlando-2025-volunteer-registration

# Ticket sales. When true, /attend/ shows the Humanitix ticket widget;
# when false it shows a "tickets not on sale yet" message instead.
tickets_on_sale: true

# Theme / dark mode settings (see _documentation/redesign-2026.md §6.17)
# Show the sun/moon light<->dark toggle in the header.
theme_toggle_enabled: false
# Default theme at the start of each session: light | dark | system | invasion
# ("system" follows the OS prefers-color-scheme; "invasion" makes every fresh
# session open in the 2026 skin). Persistence is SESSION-only — the active theme
# is kept in sessionStorage (survives reloads/navigation within the tab) but a
# new session (window closed/reopened, fresh tab) starts at this default. The
# Maker Invasion skin can also be turned on for a session by visiting /invasion/.
theme_default: light
# Show the UFO button that enables the 2026 "Maker Invasion" skin. Hiding it does
# NOT disable invasion — /invasion/ still triggers it (e.g. for a share link).
theme_invasion_icon: false
# Invasion UFO scene wind-down (resets on every page load):
#  - duration: seconds of full activity; after this the on-screen UFOs finish
#    their pass but no NEW ones cross. Set 0 to run indefinitely (no wind-down).
#  - fadeout: seconds AFTER that before the remaining UFOs fade out and are
#    removed (and the layer drops back behind the content for readability).
theme_invasion_fx_duration: 10
theme_invasion_fx_fadeout: 10

#homepage settings
featured_makers: true
event_shirt_promo: false
# Show links/arrows on the "Explore the Faire" cards. Set false early in the
# year before the category/stage pages have fresh content to link to.
explore_card_links: true

footer_ad: false
footer_ad_url: /attend/

newsletter_url: https://eepurl.com/bpCB8T

event_year: 2026
sponsor_year: 2025 #use this when showing prior year sponsors

event_name: Maker Faire Orlando

# These are used in the includes date-*-*.html
event_dates:
  edu_day: 2026-11-06
  day1: 2026-11-07
  day2: 2026-11-08

event_hours: 10am to 5pm
edu_hours: 10am to 3pm

event_location_descr: Central Florida Fairgrounds & Expo Halls
cta_event_url: /attend/

contact_email: makers@makerfaireorlando.com

# badge page settings
badge_show_update_warning: true
badge_show_space_plans: false

# maker manual page settings
maker_manual_show_update_warning: true

# schedule page settings
schedule_show_update_warning: true

# promote page settings
promote_show_update_warning: true

# program page settings
program_show_update_warning: true
